{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kanji Flashcards</title>

  <!-- CSS -->
<link rel="stylesheet" href="{% static 'flashcards/css/style.css' %}">

</head>
<body>

<!-- 🔹 Navigation bar -->
<nav class="navbar">
  <div class="nav-left">
    <a href="{% url 'home' %}" class="logo">Home</a>
    {% if user.is_authenticated %}
      <a href="{% url 'flashcards' %}">Flashcards</a>
      <a href="{% url 'account' %}">My Account</a>
      <a href="{% url 'grammar' %}">Grammar</a>
    {% endif %}
  </div>

  <div class="nav-right">
    {% if user.is_authenticated %}
      <!-- <span class="welcome">Welcome, {{ user.username }}</span> -->

      <form method="post" action="{% url 'logout' %}" style="display:inline;">
        {% csrf_token %}
        <button type="submit" class="logout-btn">Logout</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}" class="login-btn">Login</a>
      <a href="{% url 'register' %}" class="register-btn">Register</a>
    {% endif %}
  </div>
</nav>


<hr>

<!-- 🔹 Page content -->
{% block content %}
{% endblock %}

</body>
</html>
